name: Friend 1 Subscription

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update subscription
        run: |
          EXPIRY="2026-10-28"
          TODAY=$(date -u +%Y-%m-%d)

          if [ "$TODAY" \< "$EXPIRY" ]; then
            curl -L \
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/vless.txt" \
              -o users/friend1.txt
          else
            : > users/friend1.txt
          fi

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add users/friend1.txt
          git diff --cached --quiet || git commit -m "Update friend 1 subscription"
          git push
