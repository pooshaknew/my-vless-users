<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت VLESS</title>
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:20px;background:#f4f4f4}
.box{background:white;padding:18px;margin-bottom:15px;border-radius:12px}
input,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box}
button{background:#111;color:white;border:0;border-radius:8px}
h1{font-size:24px}
.small{font-size:13px;color:#666}
</style>
</head>

<body>

<h1>پنل مدیریت VLESS</h1>

<div class="box">
<h3>اتصال به GitHub</h3>

<input id="token" type="password" placeholder="GitHub Token">

<button onclick="loadUsers()">ورود به پنل</button>

<p id="status" class="small"></p>
</div>

<div id="panel" style="display:none">

<div class="box">
<h3>Friend 1</h3>

<label>تاریخ انقضا</label>
<input id="date1" type="date">

<button onclick="saveUser(1)">ذخیره Friend 1</button>

<p>
لینک اشتراک:
<br>
<code>
https://raw.githubusercontent.com/pooshaknew/my-vless-users/main/users/friend1.txt
</code>
</p>
</div>

<div class="box">
<h3>Friend 2</h3>

<label>تاریخ انقضا</label>
<input id="date2" type="date">

<button onclick="saveUser(2)">ذخیره Friend 2</button>

<p>
لینک اشتراک:
<br>
<code>
https://raw.githubusercontent.com/pooshaknew/my-vless-users/main/users/friend2.txt
</code>
</p>
</div>

</div>

<script>

const owner="pooshaknew";
const repo="my-vless-users";

let token="";

async function github(path,options={}){

const response=await fetch(
`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,
{
...options,
headers:{
"Authorization":`Bearer ${token}`,
"Accept":"application/vnd.github+json",
"Content-Type":"application/json"
}
});

if(!response.ok){

throw new Error(await response.text());

}

return response.json();

}

async function loadUsers(){

token=document.getElementById("token").value.trim();

if(!token){

alert("توکن GitHub را وارد کن");

return;

}

try{

await github("users/friend1.txt");

document.getElementById("panel").style.display="block";

document.getElementById("status").innerText=
"اتصال موفق بود.";

}catch(error){

document.getElementById("status").innerText=
"خطا در اتصال به GitHub";

}

}

async function saveUser(number){

const date=document.getElementById("date"+number).value;

if(!date){

alert("تاریخ انقضا را انتخاب کن");

return;

}

try{

const workflow=await github(".github/workflows/main.yml");

const decoder=new TextDecoder();

const binary=atob(workflow.content.replace(/\n/g,""));

const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));

let yaml=new TextDecoder().decode(bytes);

const pattern=
new RegExp(`EXPIRY${number}="[^"]*"`);

if(!pattern.test(yaml)){

alert("EXPIRY این کاربر در main.yml پیدا نشد");

return;

}

yaml=yaml.replace(
pattern,
`EXPIRY${number}="${date}"`
);

const encoded=
btoa(unescape(encodeURIComponent(yaml)));

await github(".github/workflows/main.yml",{

method:"PUT",

body:JSON.stringify({

message:`Update friend${number} expiry`,

content:encoded,

sha:workflow.sha

})

});

alert(
`تاریخ Friend ${number} ذخیره شد`
);

}catch(error){

alert("خطا: "+error.message);

}

}

</script>

</body>
  </html>
